<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0F0A1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
  }

  /* ── Toolbar bar ── */
  #bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 38px;
    background: #0F0A1A;
    border-bottom: 1px solid rgba(139,92,246,0.15);
    display: flex;
    align-items: center;
    -webkit-app-region: drag;
    z-index: 9999;
  }

  .group {
    display: flex;
    align-items: center;
    -webkit-app-region: no-drag;
  }

  .left { padding-left: 6px; }

  button {
    width: 40px; height: 38px;
    border: none; background: transparent;
    color: #5a5370;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s;
    outline: none;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }
  button:hover  { color: #a78bfa; background: rgba(139,92,246,0.09); }
  button:active { background: rgba(139,92,246,0.18); }
  button svg    { display: block; pointer-events: none; }

  button.winbtn { width: 46px; color: rgba(255,255,255,0.35); }
  button.winbtn:hover { color: #fff; background: rgba(255,255,255,0.07); }
  #close-btn:hover { background: #c42b1c !important; color: #fff !important; }

  .sep {
    width: 1px; height: 14px;
    background: rgba(255,255,255,0.07);
    margin: 0 2px;
    flex-shrink: 0;
  }

  #zoom-badge {
    display: none;
    font-size: 10px; font-weight: 600;
    color: #a78bfa;
    background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 4px;
    padding: 1px 6px;
    min-width: 32px; text-align: center;
    letter-spacing: 0.03em;
    cursor: default;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }

  #back-btn { display: none; }
  #back-sep  { display: none; }

  .drag-mid {
    flex: 1;
    height: 100%;
    -webkit-app-region: drag;
  }

  /* ── Webview fills everything below the bar ── */
  webview {
    position: fixed;
    top: 38px; left: 0; right: 0; bottom: 0;
    width: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div id="bar">
  <!-- Left controls -->
  <div class="group left">
    <button id="back-btn" title="Back to portal">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sep" id="back-sep"></div>

    <button id="zoom-in" title="Zoom in">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <span id="zoom-badge"></span>

    <button id="zoom-out" title="Zoom out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div class="sep"></div>

    <button id="zoom-reset" title="Reset zoom">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.51 15a9 9 0 1 0 .49-4.5"/><polyline points="3 3 3 11 11 11"/></svg>
    </button>

    <div class="sep"></div>

    <button id="refresh" title="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>

  <!-- Draggable middle -->
  <div class="drag-mid"></div>

  <!-- Right: window controls -->
  <div class="group">
    <button class="winbtn" id="min-btn" title="Minimize">
      <svg width="11" height="2" viewBox="0 0 11 2"><rect width="11" height="1.5" fill="currentColor"/></svg>
    </button>
    <button class="winbtn" id="max-btn" title="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="winbtn" id="close-btn" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
    </button>
  </div>
</div>

<!-- The site loads here, completely isolated from the toolbar above -->
<webview
  id="site"
  src="https://omlife.in/my-portal/"
  allowpopups
></webview>

<script>
const PORTAL = 'https://omlife.in/my-portal/';
const site   = document.getElementById('site');
const badge  = document.getElementById('zoom-badge');
const backBtn  = document.getElementById('back-btn');
const backSep  = document.getElementById('back-sep');
let zoom = 1.0;

// ── Zoom — only affects the webview, never the toolbar ──────────────────────
function setZoom(z) {
  zoom = Math.max(0.5, Math.min(2.0, parseFloat(z.toFixed(1))));
  site.setZoomFactor(zoom);
  const pct = Math.round(zoom * 100);
  if (pct === 100) {
    badge.style.display = 'none';
  } else {
    badge.textContent = pct + '%';
    badge.style.display = 'inline-block';
  }
}

document.getElementById('zoom-in')   .onclick = () => setZoom(zoom + 0.1);
document.getElementById('zoom-out')  .onclick = () => setZoom(zoom - 0.1);
document.getElementById('zoom-reset').onclick = () => setZoom(1.0);
document.getElementById('refresh')   .onclick = () => site.reload();

// ── Back button ──────────────────────────────────────────────────────────────
backBtn.onclick = () => site.loadURL(PORTAL);

function updateBack(url) {
  const onPortal = url.startsWith(PORTAL) || url === 'https://omlife.in/my-portal';
  backBtn.style.display = onPortal ? 'none' : 'flex';
  backSep.style.display = onPortal ? 'none' : 'block';
}

site.addEventListener('did-navigate',         e => updateBack(e.url));
site.addEventListener('did-navigate-in-page', e => updateBack(e.url));
site.addEventListener('did-finish-load',      () => updateBack(site.getURL()));

// Open external links in browser instead of inside the app
site.addEventListener('will-navigate', e => {
  try {
    const host = new URL(e.url).hostname;
    if (!host.endsWith('omlife.in')) {
      e.preventDefault();
      require('electron').shell.openExternal(e.url);
    }
  } catch {}
});

// ── Window controls ──────────────────────────────────────────────────────────
const { ipcRenderer } = require('electron');
document.getElementById('min-btn')  .onclick = () => ipcRenderer.send('win:minimize');
document.getElementById('max-btn')  .onclick = () => ipcRenderer.send('win:maximize');
document.getElementById('close-btn').onclick = () => ipcRenderer.send('win:close');
</script>

</body>
</html>
