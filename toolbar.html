<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0F0A1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
  }
  body { display: flex; flex-direction: column; }

  #bar {
    flex: 0 0 38px; height: 38px;
    background: #0F0A1A;
    border-bottom: 1px solid rgba(139,92,246,0.12);
    display: flex; align-items: center;
    -webkit-app-region: drag; z-index: 20;
  }
  .group { display: flex; align-items: center; height: 100%; -webkit-app-region: no-drag; }
  .left { padding-left: 6px; }
  button {
    width: 40px; height: 38px;
    border: none; background: transparent;
    color: #5a5370; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s;
    outline: none; -webkit-app-region: no-drag; flex-shrink: 0;
  }
  button:hover  { color: #a78bfa; background: rgba(139,92,246,0.09); }
  button:active { background: rgba(139,92,246,0.18); }
  button svg    { display: block; pointer-events: none; }
  button.winbtn { width: 46px; color: rgba(255,255,255,0.35); }
  button.winbtn:hover { color: #fff; background: rgba(255,255,255,0.07); }
  #close-btn:hover { background: #c42b1c !important; color: #fff !important; }
  .sep { width: 1px; height: 14px; background: rgba(255,255,255,0.07); margin: 0 2px; flex-shrink: 0; }
  #zoom-badge {
    display: none; font-size: 10px; font-weight: 600;
    color: #a78bfa; background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.2); border-radius: 4px;
    padding: 1px 6px; min-width: 32px; text-align: center;
    letter-spacing: 0.03em; cursor: default; flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  #back-btn, #back-sep { display: none; }
  .drag-mid { flex: 1; height: 100%; -webkit-app-region: drag; }

  #tabstrip {
    flex: 0 0 36px; height: 36px;
    background: #0B0712;
    border-bottom: 1px solid rgba(139,92,246,0.12);
    display: flex; align-items: stretch;
    overflow-x: auto; overflow-y: hidden;
    -webkit-app-region: no-drag;
  }
  #tabstrip::-webkit-scrollbar { height: 0; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    min-width: 120px; max-width: 200px;
    padding: 0 8px 0 14px; height: 36px;
    background: transparent;
    border-right: 1px solid rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
    font-size: 12px; cursor: pointer;
    position: relative;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
  }
  .tab:hover { background: rgba(139,92,246,0.06); color: rgba(255,255,255,0.65); }
  .tab.active { background: #0F0A1A; color: #fff; }
  .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: #8B5CF6;
  }
  .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    width: 18px; height: 18px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.3); flex-shrink: 0;
    transition: background 0.12s, color 0.12s;
  }
  .tab-close:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .tab-close svg { display: block; }
  #new-tab-btn {
    width: 36px; height: 36px;
    border: none; background: transparent;
    color: rgba(255,255,255,0.4); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.12s, background 0.12s;
  }
  #new-tab-btn:hover { color: #a78bfa; background: rgba(139,92,246,0.08); }

  #views { flex: 1 1 auto; position: relative; background: #fff; }
  webview {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    border: none; display: none;
  }
  webview.active { display: flex; }
</style>
</head>
<body>

<div id="bar">
  <div class="group left">
    <button id="back-btn" title="Back to portal">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sep" id="back-sep"></div>
    <button id="nav-back" title="Go back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <button id="nav-fwd" title="Go forward">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>

    <div class="sep"></div>

    <button id="zoom-in" title="Zoom in">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <span id="zoom-badge"></span>
    <button id="zoom-out" title="Zoom out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="zoom-reset" title="Reset zoom">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.51 15a9 9 0 1 0 .49-4.5"/><polyline points="3 3 3 11 11 11"/></svg>
    </button>

    <div class="sep"></div>

    <button id="refresh" title="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>

  <div class="drag-mid"></div>

  <div class="group">
    <button class="winbtn" id="min-btn" title="Minimize">
      <svg width="11" height="2" viewBox="0 0 11 2"><rect width="11" height="1.5" fill="currentColor"/></svg>
    </button>
    <button class="winbtn" id="max-btn" title="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="winbtn" id="close-btn" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
    </button>
  </div>
</div>

<div id="tabstrip">
  <button id="new-tab-btn" title="New tab (Ctrl+T)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<div id="views"></div>

<script>
const PORTAL = 'https://omlife.in/my-portal/';
const HOME   = 'https://omlife.in/my-portal/';

const tabstrip  = document.getElementById('tabstrip');
const viewsEl   = document.getElementById('views');
const newTabBtn = document.getElementById('new-tab-btn');
const badge     = document.getElementById('zoom-badge');
const backBtn   = document.getElementById('back-btn');
const backSep   = document.getElementById('back-sep');

let tabs = [];
let activeId = null;
let tabCounter = 0;

function createTab(url, activate) {
  if (activate === undefined) activate = true;
  const id = ++tabCounter;

  const wv = document.createElement('webview');
  wv.setAttribute('src', url);
  wv.setAttribute('partition', 'persist:omlife');
  wv.setAttribute('allowpopups', '');
  wv.setAttribute('preload', window.electronAPI.webviewPreloadPath());
  wv.dataset.id = id;
  viewsEl.appendChild(wv);

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.dataset.id = id;
  tabEl.innerHTML =
    '<span class="tab-title">Loading…</span>' +
    '<span class="tab-close" title="Close tab">' +
      '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>' +
    '</span>';
  tabstrip.insertBefore(tabEl, newTabBtn);

  const titleEl = tabEl.querySelector('.tab-title');
  const closeEl = tabEl.querySelector('.tab-close');

  const tab = { id: id, webview: wv, tabEl: tabEl, titleEl: titleEl, url: url, zoom: 1.0 };
  tabs.push(tab);

  tabEl.addEventListener('click', function(e) {
    if (e.target.closest('.tab-close')) return;
    activateTab(id);
  });
  closeEl.addEventListener('click', function(e) {
    e.stopPropagation();
    closeTab(id);
  });

  wv.addEventListener('dom-ready', function() {
    wv.setZoomFactor(tab.zoom);
  });
  wv.addEventListener('page-title-updated', function(e) {
    titleEl.textContent = e.title || 'OmLife';
  });
  wv.addEventListener('did-navigate',         function(e){ onNav(tab, e.url); });
  wv.addEventListener('did-navigate-in-page', function(e){ onNav(tab, e.url); });
  wv.addEventListener('did-finish-load',      function(){ onNav(tab, wv.getURL()); });

  wv.addEventListener('new-window', function(e) {
    e.preventDefault();
    if (e.url && e.url.indexOf('omlife.in') !== -1) {
      createTab(e.url, true);
    } else if (e.url) {
      window.electronAPI.openExternal(e.url);
    }
  });

  wv.addEventListener('will-navigate', function(e) {
    try {
      if (!new URL(e.url).hostname.endsWith('omlife.in')) {
        e.preventDefault();
        window.electronAPI.openExternal(e.url);
      }
    } catch (err) {}
  });

  // Ctrl+Click detected inside the page → open in a new tab
  wv.addEventListener('ipc-message', function(e) {
    if (e.channel === 'open-in-new-tab' && e.args && e.args[0]) {
      createTab(e.args[0], true);
    }
  });

  if (activate) activateTab(id);
  return tab;
}

function activateTab(id) {
  activeId = id;
  tabs.forEach(function(t) {
    var isActive = t.id === id;
    t.webview.classList.toggle('active', isActive);
    t.tabEl.classList.toggle('active', isActive);
    if (isActive) {
      updateBadge(t.zoom);
      updateBackBtn(t.url);
    }
  });
}

function closeTab(id) {
  var idx = tabs.findIndex(function(t){ return t.id === id; });
  if (idx === -1) return;
  var tab = tabs[idx];
  tab.webview.remove();
  tab.tabEl.remove();
  tabs.splice(idx, 1);

  if (tabs.length === 0) { createTab(HOME, true); return; }
  if (activeId === id) {
    var next = tabs[Math.min(idx, tabs.length - 1)];
    activateTab(next.id);
  }
}

function onNav(tab, url) {
  tab.url = url;
  if (tab.id === activeId) updateBackBtn(url);
}

function getActive() {
  return tabs.find(function(t){ return t.id === activeId; });
}

function updateBackBtn(url) {
  var onPortal = url.startsWith(PORTAL) || url === 'https://omlife.in/my-portal';
  backBtn.style.display = onPortal ? 'none'  : 'flex';
  backSep.style.display = onPortal ? 'none'  : 'block';
}

function updateBadge(zoom) {
  var pct = Math.round(zoom * 100);
  badge.style.display = pct === 100 ? 'none' : 'inline-block';
  if (pct !== 100) badge.textContent = pct + '%';
}

document.getElementById('nav-back').onclick = function() {
  var t = getActive(); if (t && t.webview.canGoBack()) t.webview.goBack();
};
document.getElementById('nav-fwd').onclick = function() {
  var t = getActive(); if (t && t.webview.canGoForward()) t.webview.goForward();
};
document.getElementById('zoom-in').onclick = function() {
  var t = getActive(); if (!t) return;
  t.zoom = Math.min(2.0, parseFloat((t.zoom + 0.1).toFixed(1)));
  t.webview.setZoomFactor(t.zoom); updateBadge(t.zoom);
};
document.getElementById('zoom-out').onclick = function() {
  var t = getActive(); if (!t) return;
  t.zoom = Math.max(0.5, parseFloat((t.zoom - 0.1).toFixed(1)));
  t.webview.setZoomFactor(t.zoom); updateBadge(t.zoom);
};
document.getElementById('zoom-reset').onclick = function() {
  var t = getActive(); if (!t) return;
  t.zoom = 1.0; t.webview.setZoomFactor(1.0); updateBadge(1.0);
};
document.getElementById('refresh').onclick = function() {
  var t = getActive(); if (t) t.webview.reload();
};
backBtn.onclick = function() {
  var t = getActive(); if (t) t.webview.loadURL(PORTAL);
};
newTabBtn.onclick = function() { createTab(HOME, true); };

document.getElementById('min-btn').onclick  = function(){ window.electronAPI.minimize(); };
document.getElementById('max-btn').onclick  = function(){ window.electronAPI.maximize(); };
document.getElementById('close-btn').onclick = function(){ window.electronAPI.close(); };

document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 't') { e.preventDefault(); createTab(HOME, true); }
  if (e.ctrlKey && e.key === 'w') { e.preventDefault(); if (activeId) closeTab(activeId); }
  if (e.ctrlKey && e.key === 'Tab') {
    e.preventDefault();
    var idx = tabs.findIndex(function(t){ return t.id === activeId; });
    var next = tabs[(idx + 1) % tabs.length];
    if (next) activateTab(next.id);
  }
});

createTab(HOME, true);
</script>

</body>
</html>
