<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0F0A1A;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
  }
  #bar {
    width: 100%; height: 100%;
    display: flex; align-items: center;
    border-bottom: 1px solid rgba(139,92,246,0.15);
    -webkit-app-region: drag;
  }
  .group {
    display: flex; align-items: center;
    -webkit-app-region: no-drag;
  }
  .left { padding-left: 6px; }
  button.tbtn {
    width: 42px; height: 38px;
    border: none; background: transparent;
    color: #4b4658;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s ease, background 0.15s ease;
    outline: none;
  }
  button.tbtn:hover {
    color: #a78bfa;
    background: rgba(139,92,246,0.08);
  }
  button.tbtn:active {
    background: rgba(139,92,246,0.16);
  }
  button.tbtn svg { display: block; }
  #back-btn { display: none; }
  .sep {
    width: 1px; height: 14px;
    background: rgba(255,255,255,0.06);
    margin: 0 3px;
    flex-shrink: 0;
  }
  #zoom-badge {
    font-size: 10px; font-weight: 600;
    color: #a78bfa;
    background: rgba(139,92,246,0.10);
    border: 1px solid rgba(139,92,246,0.18);
    border-radius: 4px;
    padding: 2px 6px;
    min-width: 32px; text-align: center;
    letter-spacing: 0.03em;
    display: none;
    cursor: default;
    flex-shrink: 0;
  }
  .mid { flex: 1; height: 100%; -webkit-app-region: drag; }
  .right {
    display: flex; align-items: center;
    -webkit-app-region: no-drag;
  }
  button.winbtn {
    width: 46px; height: 38px;
    border: none; background: transparent;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
    outline: none;
  }
  button.winbtn:hover { background: rgba(255,255,255,0.07); color: #fff; }
  #close-btn:hover { background: #c42b1c; color: #fff; }
</style>
</head>
<body>

<div id="bar">
  <div class="group left">
    <button class="tbtn" id="back-btn" title="Back to portal">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sep" id="back-sep" style="display:none"></div>

    <button class="tbtn" id="zoom-in-btn" title="Zoom in">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <span id="zoom-badge">100%</span>

    <button class="tbtn" id="zoom-out-btn" title="Zoom out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div class="sep"></div>

    <button class="tbtn" id="zoom-reset-btn" title="Reset zoom">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.51 15a9 9 0 1 0 .49-4.5"/><polyline points="3 3 3 11 11 11"/></svg>
    </button>

    <div class="sep"></div>

    <button class="tbtn" id="refresh-btn" title="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>

  <div class="mid"></div>

  <div class="group right">
    <button class="winbtn" id="min-btn" title="Minimize">
      <svg width="11" height="2" viewBox="0 0 11 2"><rect width="11" height="1.4" fill="currentColor"/></svg>
    </button>
    <button class="winbtn" id="max-btn" title="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.1"/></svg>
    </button>
    <button class="winbtn" id="close-btn" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
    </button>
  </div>
</div>

<script src="toolbar-renderer.js"></script>
</body>
</html>
